name: UGCRuleBook CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: |
          cd UGCRuleBook
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install testing and lint tools
        run: python -m pip install pytest ruff

      - name: Run Ruff
        run: cd UGCRuleBook && python -m ruff check .

      - name: Run Pytest
        run: cd UGCRuleBook && python -m pytest -v

      - name: Build Docker image
        run: cd UGCRuleBook && docker build -t ugcrulebook:ci .
