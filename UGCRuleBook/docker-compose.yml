
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: ugcrulebook-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/arm64
    container_name: ugcrulebook-ui
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    environment:
      UGCRULEBOOK_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
